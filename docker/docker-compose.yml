services:
  mongo:
    image: mongo:7
    container_name: mt3-mongo
    ports:
      - "27017:27017"
    volumes:
      - ../db:/data/db
    environment:
      MONGO_INITDB_DATABASE: mediatracker
    # NEU: Docker prüft hier alle 5 Sekunden, ob die DB wirklich bereit ist
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mt3-backend
    ports:
      - "8080:8080"
    # NEU: Das Backend wartet, bis der Healthcheck von Mongo "healthy" meldet
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/mediatracker
      SPRING_THREADS_VIRTUAL_ENABLED: "true"