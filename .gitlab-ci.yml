
stages:
  - build
  - test

build_library:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: mongo:7
      alias: mongo
  variables:
    SPRING_DATA_MONGODB_URI: "mongodb://mongo:27017/mediatracker_test"
  script:
        - echo "Mongo test template (disabled)"
  rules:
    - when: never #when line entfernen, sobald tests da sind

build_backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: backend-m2
    paths:
      - .m2/repository/
  script:
    - cd backend
    - mvn -B -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -DskipTests package
  artifacts:
    when: on_success
    paths:
      - backend/target/*.jar

build_frontend:
  stage: build
  image: node:22
  cache:
    key: frontend
    paths:
      - frontend/node_modules/
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    when: on_success
    paths:
      - frontend/dist/