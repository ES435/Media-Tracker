stages:
  - lint
  - test
  - build
  - package
  - deploy

# Global variables apply to ALL jobs in the pipeline
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://localhost:2375"
  DOCKER_DRIVER: overlay2

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - frontend/node_modules/
    - frontend/.npm/

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ==========================================
# STAGE: LINT
# ==========================================

frontend_lint:
  stage: lint
  image: node:22
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint
  rules:
    - when: on_success

backend_validate:
  stage: lint
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn validate
  rules:
    - when: on_success

# ==========================================
# STAGE: TEST
# ==========================================

backend_test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn test
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml

# ==========================================
# STAGE: BUILD
# ==========================================

backend_build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn package -DskipTests
  artifacts:
    expire_in: 1 hour
    paths:
      - backend/target/*.jar
  needs: ["backend_test"]

frontend_build:
  stage: build
  image: node:22
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    expire_in: 1 hour
    paths:
      - frontend/dist/
  needs: ["frontend_lint"]

# ==========================================
# STAGE: PACKAGE (Docker)
# ==========================================

docker_build_backend:
  stage: package
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  allow_failure: true # This makes the job optional; failure won't stop the pipeline
  before_script:
    # Wait until docker daemon is available
    - |
      for i in $(seq 1 30); do
        if docker info > /dev/null 2>&1; then
          echo "Docker daemon is ready!"
          break
        fi
        echo "Waiting for Docker daemon..."
        sleep 1
      done
  script:
    - echo "Building Backend Docker Image..."
    - docker build -t media-tracker-backend:latest backend/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs: ["backend_build"]

docker_build_frontend:
  stage: package
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  allow_failure: true # This makes the job optional; failure won't stop the pipeline
  before_script:
    - |
      for i in $(seq 1 30); do
        if docker info > /dev/null 2>&1; then
          echo "Docker daemon is ready!"
          break
        fi
        echo "Waiting for Docker daemon..."
        sleep 1
      done
  script:
    - echo "Building Frontend Docker Image..."
    - docker build -t media-tracker-frontend:latest frontend/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs: ["frontend_build"]