<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>MT3 – Suche</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --bg-page: #f6efe8;
            --bg-card: #ffffff;
            --bg-soft: #fdf7f0;
            --accent: #f59e85;
            --accent-strong: #f97373;
            --accent-soft: #ffe6dd;
            --text-main: #262626;
            --text-muted: #8a7a6d;
            --border-soft: #e1d5c8;
            --shadow-soft: 0 20px 45px rgba(148, 118, 94, 0.25);
            --shadow-card: 0 12px 28px rgba(148, 118, 94, 0.18);
            --radius-lg: 18px;
            --radius-xl: 24px;
            --radius-pill: 999px;
            --transition-med: 0.48s cubic-bezier(0.21, 0.7, 0.3, 1);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #fef8f0 0, #f6efe8 40%, #f1e5d8 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 14px;
        }

        .app-shell {
            width: 100%;
            max-width: 1180px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* HEADER */

        .app-header {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(225, 213, 200, 0.95);
            box-shadow: 0 16px 36px rgba(148, 118, 94, 0.28);
            backdrop-filter: blur(12px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-pill {
            width: 36px;
            height: 36px;
            border-radius: 14px;
            background: radial-gradient(circle at 0 0, #f97373, #fbbf77 40%, #fde3b2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            box-shadow: 0 8px 16px rgba(244, 114, 94, 0.6);
        }

        .app-name {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .app-name-main {
            font-size: 0.98rem;
            font-weight: 600;
        }

        .app-name-sub {
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        .header-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .tab-link {
            position: relative;
            border-radius: var(--radius-pill);
            padding: 7px 16px;
            font-size: 0.82rem;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
        }

        .tab-link::after {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 3px;
            height: 2px;
            border-radius: 999px;
            background: transparent;
            opacity: 0;
            transform: translateY(3px);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .tab-link:hover {
            background: #fbf2e7;
            color: var(--text-main);
            box-shadow: 0 4px 10px rgba(148, 118, 94, 0.16);
        }

        .tab-link.active {
            background: #faeee3;
            color: #b45309;
            box-shadow: 0 10px 22px rgba(148, 118, 94, 0.24);
        }

        .tab-link.active::after {
            background: var(--accent);
            opacity: 1;
            transform: translateY(0);
        }

        .header-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .user-avatar {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 9px 4px 4px;
            border-radius: 999px;
            background: #fff7f0;
            border: 1px solid rgba(221, 204, 188, 0.95);
            box-shadow: 0 4px 10px rgba(148, 118, 94, 0.18);
            transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .user-avatar:hover {
            transform: translateY(-1px);
            background: #fff1e8;
            box-shadow: 0 7px 16px rgba(148, 118, 94, 0.24);
        }

        .user-avatar-circle {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: linear-gradient(135deg, #f97373, #fb923c);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .user-avatar-name {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* MAIN-BEREICH */

        .app-main {
            flex: 1;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 26px;
            border: 1px solid rgba(225, 213, 200, 0.95);
            box-shadow: var(--shadow-soft);
            padding: 18px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;   /* Scroll nach unten/oben erlauben */
            overflow-x: hidden;
        }

        .search-page {
            display: flex;
            flex-direction: column;
            min-height: 100%;
        }

        /* Suchbereich – Shell */

        .search-shell {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
        }

        .search-shell.compact {
            /* Marker-Klasse, evtl. später nutzbar */
        }

        /* Suchleiste – gleitet per margin-top */

        .search-bar {
            display: flex;
            align-items: stretch;
            border-radius: var(--radius-pill);
            background: #fffdf8;
            border: 1px solid var(--border-soft);
            padding: 6px 8px;
            max-width: 780px;
            width: 100%;
            box-shadow: 0 26px 60px rgba(148, 118, 94, 0.35);

            /* Startposition: Mitte */
            margin-top: 22vh;

            transition:
                    margin-top 1.2s cubic-bezier(0.21, 0.7, 0.3, 1),
                    max-width 1.2s cubic-bezier(0.21, 0.7, 0.3, 1),
                    box-shadow 1.2s cubic-bezier(0.21, 0.7, 0.3, 1),
                    border-radius 1.2s cubic-bezier(0.21, 0.7, 0.3, 1),
                    background 1.2s cubic-bezier(0.21, 0.7, 0.3, 1);
        }

        .search-shell.compact .search-bar {
            margin-top: 0;
            max-width: 560px;
            box-shadow: 0 12px 30px rgba(148, 118, 94, 0.22);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 14px 18px;
            font-size: 1.15rem;
            color: var(--text-main);
        }

        .search-input::placeholder {
            color: #b29a88;
        }

        .search-button-inline {
            border: none;
            border-radius: var(--radius-pill);
            padding: 0 22px;
            background: linear-gradient(135deg, var(--accent-strong), var(--accent));
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 16px 36px rgba(244, 114, 94, 0.55);
            transition: transform 0.08s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .search-button-inline:hover {
            transform: translateY(-1px);
            box-shadow: 0 20px 44px rgba(244, 114, 94, 0.6);
            filter: brightness(1.02);
        }

        .search-button-inline:active {
            transform: translateY(0);
            box-shadow: 0 12px 30px rgba(244, 114, 94, 0.48);
        }

        /* Filter-Toggle + Panel */

        .search-controls-row {
            width: 100%;
            max-width: 780px;
            margin-top: 10px;
            display: flex;
            justify-content: flex-start;
        }

        .filter-toggle {
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-soft);
            padding: 5px 14px;
            font-size: 0.8rem;
            cursor: pointer;
            background: var(--bg-soft);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 14px rgba(148, 118, 94, 0.16);
            transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease, color 0.15s ease;
        }

        .filter-toggle:hover {
            background: #fff3e8;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(148, 118, 94, 0.22);
            color: var(--text-main);
        }

        .filters-panel {
            margin-top: 10px;
            width: 100%;
            max-width: 840px;
            border-radius: var(--radius-xl);
            background: var(--bg-soft);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-card);
            padding: 12px 14px;
            display: none;
        }

        .filters-panel.visible {
            display: block;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(0, 0.9fr) minmax(0, 0.9fr);
            gap: 10px;
        }

        @media (max-width: 900px) {
            .filters-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.8rem;
        }

        .filter-label {
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.13em;
            color: var(--text-muted);
        }

        .media-chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .media-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 9px;
            border-radius: 999px;
            border: 1px solid rgba(221, 204, 188, 0.95);
            background: #fff9f3;
            font-size: 0.76rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
        }

        .media-chip input {
            margin: 0;
            width: 14px;
            height: 14px;
        }

        .media-chip:hover {
            background: #fff1e6;
            transform: translateY(-1px);
        }

        .media-chip.active {
            background: #fae1d7;
            border-color: var(--accent-soft);
            color: #9a4f2c;
        }

        .filter-control {
            width: 100%;
            padding: 7px 10px;
            border-radius: 12px;
            border: 1px solid var(--border-soft);
            background: #fffbf6;
            font-size: 0.84rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .filter-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(243, 134, 134, 0.3);
            background: #fffdf9;
        }

        /* Suchergebnisse – erst nach der Suche sichtbar */

        .search-results-section {
            margin-top: 14px;
            border-top: 1px solid transparent; /* unsichtbarer Trennstrich */
            padding-top: 10px;
            display: none;
            flex-direction: column;
        }

        .search-results-section.visible {
            display: flex;
        }

        .results-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .view-toggle {
            display: inline-flex;
            border-radius: 999px;
            background: #fbf2e7;
            border: 1px solid rgba(221, 204, 188, 0.95);
            padding: 2px;
        }

        .view-toggle button {
            border: none;
            border-radius: 999px;
            background: transparent;
            padding: 4px 9px;
            font-size: 0.78rem;
            cursor: pointer;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .view-toggle button.active {
            background: #fff;
            color: #9a4f2c;
            box-shadow: 0 4px 10px rgba(148, 118, 94, 0.2);
        }

        .results-container {
            position: relative;
            min-height: 140px;
        }

        .results-scroll {
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }

        /* Karten + Klick-Animation */

        .result-card,
        .result-card-grid {
            position: relative;
        }

        .result-card {
            display: grid;
            grid-template-columns: 64px minmax(0, 1.6fr) minmax(0, 0.9fr);
            gap: 8px;
            padding: 8px 10px;
            border-radius: 16px;
            background: #fffaf4;
            border: 1px solid rgba(225, 213, 200, 0.95);
            box-shadow: 0 10px 24px rgba(148, 118, 94, 0.18);
            cursor: pointer;
            transition: transform 0.09s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(148, 118, 94, 0.24);
            background: #fff7ef;
        }

        .result-card-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 8px 10px;
            border-radius: 16px;
            background: #fffaf4;
            border: 1px solid rgba(225, 213, 200, 0.95);
            box-shadow: 0 12px 26px rgba(148, 118, 94, 0.2);
            cursor: pointer;
            transition: transform 0.09s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .result-card-grid:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 34px rgba(148, 118, 94, 0.26);
            background: #fff7ef;
        }

        /* Klick-Pop-Animation */

        @keyframes card-pop {
            0% {
                transform: translateY(0) scale(1);
            }
            40% {
                transform: translateY(-2px) scale(1.02);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }

        .result-card.opening,
        .result-card-grid.opening {
            animation: card-pop 0.25s ease-out;
        }

        .result-thumb {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            background: radial-gradient(circle at 0 0, #f97373, #fb923c);
            border: 1px solid rgba(214, 191, 172, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 0.76rem;
            color: #fef3c7;
        }

        .result-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .result-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .result-title {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .result-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.74rem;
        }

        .result-tag {
            padding: 2px 7px;
            border-radius: 999px;
            background: #f1e4d8;
            border: 1px solid rgba(214, 191, 172, 0.9);
            color: #7d6a5a;
        }

        .result-tag strong {
            font-weight: 500;
            color: #4b3b30;
        }

        .result-secondary {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .result-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            font-size: 0.76rem;
        }

        .result-type-pill {
            font-size: 0.74rem;
            padding: 2px 8px;
            border-radius: 999px;
            background: #fff1eb;
            color: #b45309;
        }

        .result-pill {
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 999px;
            background: #faf1e5;
            color: #9a7152;
        }

        .empty-state {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .empty-state.visible {
            display: flex;
        }

        .empty-card {
            max-width: 260px;
            text-align: center;
            padding: 18px 16px;
            border-radius: 20px;
            background: #fff8f1;
            border: 1px dashed rgba(221, 204, 188, 0.95);
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 1.7rem;
            margin-bottom: 6px;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: linear-gradient(140deg, rgba(255, 255, 255, 0.96), rgba(255, 250, 245, 0.96));
        }

        .loading-overlay.visible {
            display: flex;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: 3px solid #f9e0d2;
            border-top-color: var(--accent-strong);
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* DETAIL-Ansicht – weiches Einblenden + Bild komplett */

        .detail-section {
            margin-top: 14px;
            border-top: 1px solid transparent;
            padding-top: 10px;
            opacity: 0;
            transform: translateY(6px);
            pointer-events: none;
            max-height: 0;
            overflow: hidden;
            transition:
                    opacity 0.35s ease,
                    transform 0.35s ease,
                    max-height 0.35s ease;
        }

        .detail-section.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            max-height: 1000px;
        }

        .detail-layout {
            display: grid;
            grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
            gap: 16px;
            align-items: flex-start;
        }

        @media (max-width: 900px) {
            .detail-layout {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        .detail-left-card {
            border-radius: 20px;
            background: #fffaf4;
            border: 1px solid rgba(225, 213, 200, 0.95);
            padding: 10px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .detail-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .detail-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .detail-cover-wrapper {
            margin-top: 4px;
            border-radius: 18px;
            background: radial-gradient(circle at 0 0, #f97373, #fb923c);
            border: 1px solid rgba(214, 191, 172, 0.95);
            max-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        .detail-cover-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 14px;
        }

        .detail-meta-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .detail-meta-tag {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 999px;
            background: #f1e4d8;
            border: 1px solid rgba(214, 191, 172, 0.9);
            color: #7d6a5a;
        }

        .detail-right-card {
            border-radius: 20px;
            background: #fffdf9;
            border: 1px solid rgba(225, 213, 200, 0.95);
            padding: 12px 12px 10px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .detail-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .detail-header-title {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .detail-back {
            border: none;
            background: transparent;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .detail-back:hover {
            color: var(--text-main);
        }

        .detail-form-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
        }

        @media (max-width: 700px) {
            .detail-form-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        .detail-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
        }

        .detail-select,
        .detail-input {
            width: 100%;
            padding: 7px 9px;
            border-radius: 12px;
            border: 1px solid var(--border-soft);
            background: #fffbf6;
            font-size: 0.85rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .detail-select:focus,
        .detail-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(243, 134, 134, 0.3);
            background: #fffdf9;
        }

        .detail-notes {
            min-height: 80px;
            resize: vertical;
        }

        .detail-actions-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .detail-actions-main {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .primary-button {
            border-radius: var(--radius-pill);
            border: none;
            padding: 8px 16px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent-strong), var(--accent));
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 10px 24px rgba(244, 114, 94, 0.48);
            transition: transform 0.08s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .primary-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 32px rgba(244, 114, 94, 0.54);
            filter: brightness(1.02);
        }

        .primary-button:active {
            transform: translateY(0);
            box-shadow: 0 10px 24px rgba(244, 114, 94, 0.44);
        }

        .outline-button {
            border-radius: var(--radius-pill);
            border: 1px solid rgba(221, 204, 188, 0.95);
            padding: 7px 14px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            background: #fff7f0;
            color: #222;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
        }

        .outline-button:hover {
            background: #fff2e8;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(148, 118, 94, 0.2);
        }

        .danger-button {
            border-color: rgba(248, 164, 143, 0.95);
            background: #fff0f0;
            color: #b91c1c;
        }

        .danger-button:hover {
            background: #ffe4e4;
            box-shadow: 0 6px 14px rgba(248, 113, 113, 0.35);
        }

        .detail-confirm {
            margin-top: 4px;
            font-size: 0.78rem;
            background: #fff2f2;
            border-radius: 14px;
            padding: 6px 8px;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .detail-confirm button {
            border-radius: 999px;
            border: none;
            padding: 4px 10px;
            font-size: 0.76rem;
            cursor: pointer;
        }

        .detail-confirm-yes {
            background: #fee2e2;
            color: #b91c1c;
        }

        .detail-confirm-no {
            background: #f3e3d3;
            color: #7d6a5a;
        }

        /* Toast */

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 50;
            padding: 8px 12px;
            border-radius: 999px;
            background: #111827;
            color: #e5e7eb;
            font-size: 0.8rem;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.65);
        }

        .toast.visible {
            display: inline-flex;
        }

        .toast-pill {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 999px;
            background: #22c55e;
            color: #022c22;
        }

        .toast-pill.err {
            background: #f97373;
            color: #450a0a;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }

            .app-header {
                grid-template-columns: 1fr;
                padding: 10px 12px;
            }

            .header-tabs {
                order: 3;
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 2px;
            }

            .app-main {
                padding: 10px 12px 12px;
                border-radius: 22px;
            }

            .search-shell.compact .search-bar {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <!-- HEADER -->
    <header class="app-header">
        <div class="header-left">
            <div class="logo-pill">MT3</div>
            <div class="app-name">
                <div class="app-name-main">Media Tracker 3</div>
            </div>
        </div>

        <nav class="header-tabs" aria-label="Navigation">
            <a href="index.html" class="tab-link active">Suche</a>
            <a href="lists.html" class="tab-link">Meine Listen</a>
            <a href="tech.html" class="tab-link">Techstuff</a>
        </nav>

        <div class="header-right">
            <button class="user-avatar" type="button" id="avatarBtn">
                <div class="user-avatar-circle">UX</div>
                <div class="user-avatar-name">User_x</div>
            </button>
        </div>
    </header>

    <!-- MAIN: nur Suche -->
    <main class="app-main">
        <section class="search-page" aria-label="Suche">
            <div class="search-shell" id="searchShell">
                <!-- große zentrale Suchleiste -->
                <div class="search-bar" id="searchBar">
                    <input
                            id="searchInput"
                            class="search-input"
                            type="text"
                            placeholder="Suche nach Medien …"
                            autocomplete="off"
                    >
                    <button type="button" class="search-button-inline" id="searchBtn">
                        <span>🔍</span>
                        <span>Suche</span>
                    </button>
                </div>

                <!-- Filter -->
                <div class="search-controls-row">
                    <button type="button" class="filter-toggle" id="filterToggle">
                        <span id="filterToggleIcon">▼</span>
                        <span id="filterToggleLabel">Filter anzeigen</span>
                    </button>
                </div>

                <section class="filters-panel" id="filtersPanel" aria-label="Suchfilter">
                    <div class="filters-grid">
                        <div class="filter-group">
                            <div class="filter-label">Medientypen</div>
                            <div class="media-chip-row" id="mediaTypeChips">
                                <label class="media-chip active" data-type="anime">
                                    <input type="checkbox" value="anime" checked>
                                    <span>Anime</span>
                                </label>
                                <label class="media-chip active" data-type="music">
                                    <input type="checkbox" value="music" checked>
                                    <span>Music</span>
                                </label>
                                <label class="media-chip" data-type="movie">
                                    <input type="checkbox" value="movie">
                                    <span>Movies</span>
                                </label>
                                <label class="media-chip" data-type="game">
                                    <input type="checkbox" value="game">
                                    <span>Games</span>
                                </label>
                                <label class="media-chip" data-type="series">
                                    <input type="checkbox" value="series">
                                    <span>Series</span>
                                </label>
                                <label class="media-chip" data-type="book">
                                    <input type="checkbox" value="book">
                                    <span>Bücher</span>
                                </label>
                                <label class="media-chip" data-type="manga">
                                    <input type="checkbox" value="manga">
                                    <span>Manga</span>
                                </label>
                            </div>
                        </div>

                        <div class="filter-group">
                            <div class="filter-label">Limit</div>
                            <input
                                    id="limitInput"
                                    class="filter-control"
                                    type="number"
                                    min="1"
                                    max="50"
                                    value="10"
                            >
                        </div>

                        <div class="filter-group">
                            <div class="filter-label">Sortierung</div>
                            <select id="sortSelect" class="filter-control">
                                <option value="relevance">Relevanz</option>
                                <option value="year_desc">Jahr (neueste zuerst)</option>
                                <option value="year_asc">Jahr (älteste zuerst)</option>
                            </select>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Ergebnisse – erst nach Suche sichtbar -->
            <section class="search-results-section" id="resultsSection" aria-label="Suchergebnisse">
                <header class="results-header-row">
                    <div id="resultsSummary"></div>
                    <div class="view-toggle" aria-label="Ansicht wechseln">
                        <button type="button" id="listViewBtn" class="active">
                            <span>☰</span>
                            <span>Liste</span>
                        </button>
                        <button type="button" id="cardViewBtn">
                            <span>▢▢</span>
                            <span>Kacheln</span>
                        </button>
                    </div>
                </header>

                <div class="results-container">
                    <div class="loading-overlay" id="resultsLoading">
                        <div class="spinner"></div>
                    </div>

                    <div class="empty-state" id="resultsEmpty">
                        <div class="empty-card">
                            <div class="empty-icon">🍃</div>
                            <div><strong>Keine Treffer gefunden.</strong></div>
                            <div>Probier andere Filter oder einen anderen Titel.</div>
                        </div>
                    </div>

                    <div class="results-scroll" id="resultsScroll">
                        <div class="results-list" id="resultsList"></div>
                        <div class="results-grid" id="resultsGrid" style="display:none;"></div>
                    </div>
                </div>
            </section>

            <!-- Detail-Ansicht -->
            <section class="detail-section" id="detailSection">
                <div class="detail-layout">
                    <article class="detail-left-card">
                        <div class="detail-title" id="detailTitle">Titel</div>
                        <div class="detail-subtitle" id="detailSubtitle"></div>

                        <div class="detail-cover-wrapper" id="detailCoverWrapper">
                            <div style="padding:14px;text-align:center;color:#fef3c7;font-size:0.8rem;">
                                Kein Bild vorhanden.
                            </div>
                        </div>

                        <div class="detail-meta-tags" id="detailMetaTags"></div>
                    </article>

                    <aside class="detail-right-card">
                        <div class="detail-header-row">
                            <div class="detail-header-title">Eintrag bearbeiten</div>
                            <button type="button" class="detail-back" id="backToResultsBtn">
                                <span>←</span>
                                <span>Zurück zu den Ergebnissen</span>
                            </button>
                        </div>

                        <div class="detail-form-grid">
                            <div class="detail-field">
                                <label class="detail-label" for="detailStatus">Status</label>
                                <select id="detailStatus" class="detail-select">
                                    <option value="PLANNED">Planned</option>
                                    <option value="IN_PROGRESS">In Progress</option>
                                    <option value="COMPLETED">Completed</option>
                                    <option value="DROPPED">Dropped</option>
                                </select>
                            </div>
                            <div class="detail-field">
                                <label class="detail-label" for="detailRating">Rating (1–10)</label>
                                <input
                                        id="detailRating"
                                        class="detail-input"
                                        type="number"
                                        min="1"
                                        max="10"
                                        placeholder="z.B. 9"
                                >
                            </div>
                        </div>

                        <div class="detail-field">
                            <label class="detail-label" for="detailNotes">Notizen</label>
                            <textarea
                                    id="detailNotes"
                                    class="detail-input detail-notes"
                                    placeholder="Eigene Gedanken, Fortschritt oder Stimmung …"
                            ></textarea>
                        </div>

                        <div class="detail-actions-row">
                            <div class="detail-actions-main">
                                <button type="button" class="primary-button" id="detailAddBtn">
                                    <span>➕</span>
                                    <span>Zur Liste hinzufügen</span>
                                </button>
                                <button type="button" class="outline-button danger-button" id="detailRemoveBtn">
                                    <span>🗑</span>
                                    <span>Aus Liste entfernen</span>
                                </button>
                            </div>
                        </div>

                        <div class="detail-confirm" id="detailConfirm">
                            <span>Eintrag wirklich entfernen?</span>
                            <button type="button" class="detail-confirm-yes" id="detailConfirmYes">Ja</button>
                            <button type="button" class="detail-confirm-no" id="detailConfirmNo">Nein</button>
                        </div>
                    </aside>
                </div>
            </section>
        </section>
    </main>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <span class="toast-pill" id="toastPill">OK</span>
    <span id="toastMsg">Nachricht</span>
</div>

<script>
    (function () {
        const qs  = (sel) => document.querySelector(sel);
        const qsa = (sel) => Array.from(document.querySelectorAll(sel));

        const state = {
            searchActivated: false,
            searchResults: [],
            selectedItem: null,
            searchViewMode: 'list'
        };

        const searchShell    = qs('#searchShell');
        const searchInput    = qs('#searchInput');
        const searchBtn      = qs('#searchBtn');
        const filterToggle   = qs('#filterToggle');
        const filterToggleIcon  = qs('#filterToggleIcon');
        const filterToggleLabel = qs('#filterToggleLabel');
        const filtersPanel   = qs('#filtersPanel');
        const mediaTypeChips = qs('#mediaTypeChips');
        const limitInput     = qs('#limitInput');
        const sortSelect     = qs('#sortSelect');

        const resultsSection = qs('#resultsSection');
        const resultsSummary = qs('#resultsSummary');
        const listViewBtn    = qs('#listViewBtn');
        const cardViewBtn    = qs('#cardViewBtn');
        const resultsLoading = qs('#resultsLoading');
        const resultsEmpty   = qs('#resultsEmpty');
        const resultsList    = qs('#resultsList');
        const resultsGrid    = qs('#resultsGrid');

        const detailSection    = qs('#detailSection');
        const detailTitle      = qs('#detailTitle');
        const detailSubtitle   = qs('#detailSubtitle');
        const detailCoverWrap  = qs('#detailCoverWrapper');
        const detailMetaTags   = qs('#detailMetaTags');
        const detailStatus     = qs('#detailStatus');
        const detailRating     = qs('#detailRating');
        const detailNotes      = qs('#detailNotes');
        const backToResultsBtn = qs('#backToResultsBtn');
        const detailAddBtn     = qs('#detailAddBtn');
        const detailSaveBtn    = qs('#detailSaveBtn');
        const detailRemoveBtn  = qs('#detailRemoveBtn');
        const detailConfirm    = qs('#detailConfirm');
        const detailConfirmYes = qs('#detailConfirmYes');
        const detailConfirmNo  = qs('#detailConfirmNo');

        const toast      = qs('#toast');
        const toastPill  = qs('#toastPill');
        const toastMsg   = qs('#toastMsg');
        let toastTimeout = null;

        function showToast(message, mode = 'ok') {
            toastMsg.textContent = message;
            toastPill.textContent = mode === 'ok' ? 'OK' : 'ERR';
            toastPill.className = 'toast-pill' + (mode === 'ok' ? '' : ' err');
            toast.classList.add('visible');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('visible'), 2400);
        }

        function setFiltersVisible(visible) {
            filtersPanel.classList.toggle('visible', visible);
            filterToggleIcon.textContent  = visible ? '▲' : '▼';
            filterToggleLabel.textContent = visible ? 'Filter verbergen' : 'Filter anzeigen';
        }

        // Filter initial versteckt
        setFiltersVisible(false);

        filterToggle.addEventListener('click', () => {
            setFiltersVisible(!filtersPanel.classList.contains('visible'));
        });

        mediaTypeChips.addEventListener('click', (e) => {
            const label = e.target.closest('.media-chip');
            if (!label) return;
            const cb = label.querySelector('input[type="checkbox"]');
            if (!cb) return;
            cb.checked = !cb.checked;
            label.classList.toggle('active', cb.checked);
        });

        function getSelectedTypes() {
            const types = [];
            qsa('#mediaTypeChips input[type="checkbox"]').forEach(cb => {
                if (cb.checked) types.push(cb.value);
            });
            return types;
        }

        function setViewMode(mode) {
            state.searchViewMode = mode;
            listViewBtn.classList.toggle('active', mode === 'list');
            cardViewBtn.classList.toggle('active', mode === 'cards');
            if (mode === 'list') {
                resultsList.style.display = 'flex';
                resultsGrid.style.display = 'none';
            } else {
                resultsList.style.display = 'none';
                resultsGrid.style.display = 'grid';
            }
        }

        listViewBtn.addEventListener('click', () => setViewMode('list'));
        cardViewBtn.addEventListener('click', () => setViewMode('cards'));
        setViewMode('list');

        function ensureSearchActivated() {
            if (!state.searchActivated) {
                state.searchActivated = true;
                searchShell.classList.add('compact');
            }
        }

        function triggerSearch() {
            const query = searchInput.value.trim();
            const types = getSelectedTypes();
            const limit = Math.max(1, Math.min(50, Number(limitInput.value) || 10));

            ensureSearchActivated();

            resultsSection.classList.add('visible');
            detailSection.classList.remove('visible');

            resultsLoading.classList.add('visible');
            resultsEmpty.classList.remove('visible');
            resultsList.innerHTML = '';
            resultsGrid.innerHTML = '';

            const params = new URLSearchParams();
            if (query) params.set('q', query);
            if (types.length) params.set('types', types.join(','));
            params.set('limit', String(limit));

            fetch('/api/search?' + params.toString())
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    state.searchResults = Array.isArray(data) ? data : [];
                    applySortClientSide();
                    renderResults();
                })
                .catch(err => {
                    console.error(err);
                    state.searchResults = [];
                    renderResults();
                    showToast('Fehler bei der Suche.', 'err');
                })
                .finally(() => {
                    resultsLoading.classList.remove('visible');
                });
        }

        function applySortClientSide() {
            const mode = sortSelect.value;
            const arr = state.searchResults;
            if (!Array.isArray(arr)) return;

            if (mode === 'year_desc') {
                arr.sort((a, b) => (b.meta?.year || 0) - (a.meta?.year || 0));
            } else if (mode === 'year_asc') {
                arr.sort((a, b) => (a.meta?.year || 0) - (b.meta?.year || 0));
            }
        }

        searchBtn.addEventListener('click', triggerSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                triggerSearch();
            }
        });

        function extractMetaLabel(item) {
            const meta = item.meta || {};
            const arr = [];
            if (meta.year)     arr.push('Jahr: ' + meta.year);
            if (meta.episodes) arr.push(meta.episodes + ' Episoden');
            if (meta.artist)   arr.push('Artist: ' + meta.artist);
            return arr;
        }

        function renderResults() {
            const results = state.searchResults || [];
            const hasResults = results.length > 0;

            resultsList.innerHTML = '';
            resultsGrid.innerHTML = '';

            if (!hasResults) {
                resultsSummary.textContent = '0 Ergebnisse';
                resultsEmpty.classList.add('visible');
                return;
            }

            resultsEmpty.classList.remove('visible');
            resultsSummary.textContent = results.length + ' Ergebnisse';

            results.forEach((item, index) => {
                const title = item.title || '(ohne Titel)';
                const type  = item.type || 'unknown';
                const year  = item.meta?.year;
                const metaParts = extractMetaLabel(item);

                const row = document.createElement('article');
                row.className = 'result-card';
                row.dataset.index = String(index);

                const thumb = document.createElement('div');
                thumb.className = 'result-thumb';
                if (item.imageUrl) {
                    const img = document.createElement('img');
                    img.src = item.imageUrl;
                    img.alt = title;
                    thumb.appendChild(img);
                } else {
                    thumb.textContent = 'MT3';
                }

                const main = document.createElement('div');
                main.className = 'result-main';

                const titleEl = document.createElement('div');
                titleEl.className = 'result-title';
                titleEl.textContent = title;

                const metaRow = document.createElement('div');
                metaRow.className = 'result-meta-row';

                const typeTag = document.createElement('div');
                typeTag.className = 'result-tag';
                typeTag.innerHTML = '<strong>' + type + '</strong>';
                metaRow.appendChild(typeTag);

                if (year) {
                    const yearTag = document.createElement('div');
                    yearTag.className = 'result-tag';
                    yearTag.innerHTML = '<strong>Jahr</strong> · ' + year;
                    metaRow.appendChild(yearTag);
                }

                metaParts.forEach(m => {
                    if (!m.startsWith('Jahr')) {
                        const tag = document.createElement('div');
                        tag.className = 'result-tag';
                        tag.textContent = m;
                        metaRow.appendChild(tag);
                    }
                });

                const secondary = document.createElement('div');
                secondary.className = 'result-secondary';
                secondary.textContent = 'Für Details klicken und in Listen speichern.';

                main.appendChild(titleEl);
                main.appendChild(metaRow);
                main.appendChild(secondary);

                const actions = document.createElement('div');
                actions.className = 'result-actions';

                const typeBadge = document.createElement('div');
                typeBadge.className = 'result-type-pill';
                typeBadge.textContent = type;

                const hint = document.createElement('div');
                hint.className = 'result-pill';
                hint.textContent = 'Detailansicht öffnen';

                actions.appendChild(typeBadge);
                actions.appendChild(hint);

                row.appendChild(thumb);
                row.appendChild(main);
                row.appendChild(actions);

                resultsList.appendChild(row);

                const card = document.createElement('article');
                card.className = 'result-card-grid';
                card.dataset.index = String(index);

                const cardThumb = document.createElement('div');
                cardThumb.className = 'result-thumb';
                if (item.imageUrl) {
                    const img2 = document.createElement('img');
                    img2.src = item.imageUrl;
                    img2.alt = title;
                    cardThumb.appendChild(img2);
                } else {
                    cardThumb.textContent = 'MT3';
                }

                const cardTitle = document.createElement('div');
                cardTitle.className = 'result-title';
                cardTitle.textContent = title;

                const cardMetaRow = document.createElement('div');
                cardMetaRow.className = 'result-meta-row';

                const cardTypeTag = document.createElement('div');
                cardTypeTag.className = 'result-tag';
                cardTypeTag.innerHTML = '<strong>' + type + '</strong>';
                cardMetaRow.appendChild(cardTypeTag);

                if (year) {
                    const yearBadge = document.createElement('div');
                    yearBadge.className = 'result-tag';
                    yearBadge.textContent = year;
                    cardMetaRow.appendChild(yearBadge);
                }

                const cardHint = document.createElement('div');
                cardHint.className = 'result-secondary';
                cardHint.textContent = 'Karte öffnen, um mehr zu sehen.';

                card.appendChild(cardThumb);
                card.appendChild(cardTitle);
                card.appendChild(cardMetaRow);
                card.appendChild(cardHint);

                resultsGrid.appendChild(card);
            });
        }

        // Klick mit Pop-Animation in der Listenansicht
        resultsList.addEventListener('click', (e) => {
            const card = e.target.closest('.result-card');
            if (!card) return;
            card.classList.add('opening');
            setTimeout(() => card.classList.remove('opening'), 250);
            const idx = Number(card.dataset.index);
            openDetailFromResultIndex(idx);
        });

        // Klick mit Pop-Animation in der Kartenansicht
        resultsGrid.addEventListener('click', (e) => {
            const card = e.target.closest('.result-card-grid');
            if (!card) return;
            card.classList.add('opening');
            setTimeout(() => card.classList.remove('opening'), 250);
            const idx = Number(card.dataset.index);
            openDetailFromResultIndex(idx);
        });

        function openDetailFromResultIndex(index) {
            const item = state.searchResults[index];
            if (!item) return;

            state.selectedItem = {
                ...item,
                status: 'PLANNED',
                rating: null,
                notes: ''
            };

            populateDetail(state.selectedItem);

            resultsSection.classList.remove('visible');
            detailSection.classList.add('visible');

            // WICHTIG: beim Öffnen der Detailansicht nach oben scrollen
            const main = document.querySelector('.app-main');
            if (main) {
                main.scrollTop = 0;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function populateDetail(entry) {
            const title = entry.title || '(ohne Titel)';
            const type  = entry.type || 'unknown';
            const meta  = entry.meta || {};

            detailTitle.textContent    = title;
            detailSubtitle.textContent = type;

            detailCoverWrap.innerHTML = '';
            if (entry.imageUrl) {
                const img = document.createElement('img');
                img.src = entry.imageUrl;
                img.alt = title;
                detailCoverWrap.appendChild(img);
            } else {
                const placeholder = document.createElement('div');
                placeholder.style.padding = '14px';
                placeholder.style.textAlign = 'center';
                placeholder.style.color = '#fef3c7';
                placeholder.style.fontSize = '0.8rem';
                placeholder.textContent = 'Kein Bild verfügbar.';
                detailCoverWrap.appendChild(placeholder);
            }

            detailMetaTags.innerHTML = '';
            const tags = [];
            tags.push('Type: ' + type);
            if (meta.year)     tags.push('Jahr: ' + meta.year);
            if (meta.episodes) tags.push(meta.episodes + ' Episoden');
            if (meta.artist)   tags.push('Artist: ' + meta.artist);

            tags.forEach(t => {
                const tag = document.createElement('div');
                tag.className = 'detail-meta-tag';
                tag.textContent = t;
                detailMetaTags.appendChild(tag);
            });

            detailStatus.value  = entry.status || 'PLANNED';
            detailRating.value  = entry.rating != null ? entry.rating : '';
            detailNotes.value   = entry.notes || '';

            detailRemoveBtn.style.display = 'inline-flex';
            detailConfirm.style.display   = 'none';
        }

        function closeDetail() {
            detailSection.classList.remove('visible');
            resultsSection.classList.add('visible');
            detailConfirm.style.display = 'none';
        }

        backToResultsBtn.addEventListener('click', closeDetail);

        function syncDetailToSelected() {
            if (!state.selectedItem) return;
            state.selectedItem.status = detailStatus.value;
            state.selectedItem.rating = detailRating.value
                ? Number(detailRating.value)
                : null;
            state.selectedItem.notes  = detailNotes.value.trim();
        }

        function sendLibraryUpdate(mode) {
            if (!state.selectedItem) return;

            if (mode === 'remove') {
                showToast('Remove wird serverseitig noch angebunden.', 'err');
                return;
            }

            syncDetailToSelected();

            const body = {
                status: state.selectedItem.status,
                rating: state.selectedItem.rating,
                notes : state.selectedItem.notes,
                searchResult: {
                    type:      state.selectedItem.type,
                    id:        state.selectedItem.id,
                    title:     state.selectedItem.title,
                    imageUrl:  state.selectedItem.imageUrl,
                    sourceUrl: state.selectedItem.sourceUrl,
                    meta:      state.selectedItem.meta || {}
                }
            };

            fetch('/api/library/addOrUpdateEntry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(() => {
                    showToast(mode === 'add'
                        ? 'Zur Bibliothek hinzugefügt.'
                        : 'Eintrag aktualisiert.');
                })
                .catch(err => {
                    console.error(err);
                    showToast('Fehler beim Speichern.', 'err');
                });
        }

        detailAddBtn.addEventListener('click', () => sendLibraryUpdate('add'));
        detailSaveBtn.addEventListener('click', () => sendLibraryUpdate('update'));

        detailRemoveBtn.addEventListener('click', () => {
            detailConfirm.style.display = 'inline-flex';
        });

        detailConfirmYes.addEventListener('click', () => {
            detailConfirm.style.display = 'none';
            sendLibraryUpdate('remove');
        });

        detailConfirmNo.addEventListener('click', () => {
            detailConfirm.style.display = 'none';
        });

        qs('#avatarBtn').addEventListener('click', () => {
            showToast('Demo-User: User_x');
        });
    })();
</script>
</body>
</html>
