<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <title>Search Feature Test Frontend</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:24px;line-height:1.35}
        .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
        input[type="text"]{padding:8px 10px;flex:1;min-width:220px}
        button{padding:8px 12px;cursor:pointer}
        label{display:flex;align-items:center;gap:6px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
        .card{border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#fff}
        .card img{width:100%;height:200px;object-fit:cover;display:block;background:#f6f6f6}
        .meta{display:flex;justify-content:space-between;gap:8px;padding:8px 10px 0;color:#555;font-size:12px;text-transform:uppercase}
        .title{padding:6px 10px 12px;font-size:14px}
        .muted{color:#888}
    </style>
</head>
<body>
<h1>Backend Search Test</h1>

<div class="row">
    <input id="q" type="text" placeholder="z. B. Naruto oder Daft Punk" />
    <button id="search">Suchen</button>
    <label><input id="tAnime" type="checkbox" checked> Anime</label>
    <label><input id="tBook" type="checkbox" checked> Book</label>
    <label><input id="tMusic" type="checkbox" checked> Music</label>
    <label><input id="tGame" type="checkbox" checked> Game</label>
    <label class="muted">Limit:
        <select id="limit">
            <option>12</option><option>24</option><option>48</option>
        </select>
    </label>
</div>

<div id="results" class="grid"></div>

<script>
    const $ = (id) => document.getElementById(id);

    function buildTypesParam() {
        const types = [];
        if ($("tAnime").checked) types.push("anime");
        if ($("tBook").checked) types.push("book");
        if ($("tMusic").checked) types.push("music");
        if ($("tGame").checked) types.push("game");
        return types.length ? "&types=" + encodeURIComponent(types.join(",")) : "";
    }

    function card(r){
        const img = r.imageUrl || "";
        const t = r.title || "";
        const type = r.type || "";
        const artist = r.meta && r.meta.artist ? r.meta.artist : null;
        return `
        <div class="card">
          <img src="${img}" alt="${t}" onerror="this.style.display='none'">
          <div class="meta">
            <span>${type}</span>
            ${artist ? `<span title="Artist">${artist}</span>` : `<span></span>`}
          </div>
          <div class="title">${t}</div>
        </div>
      `;
    }

    function bookCard(r){
        const img = r.imageUrl || "";
        const title = r.title || "";
        const authors = r.meta && r.meta.authors ? r.meta.authors.join(", ") : "Unbekannt";
        const year = r.meta && r.meta.year ? r.meta.year : "–";

        return `
    <div class="card" onclick="window.open('${r.sourceUrl}','_blank')">
      <img src="${img}" alt="${title}" onerror="this.style.display='none'">
      <div class="meta">
        <span>Book</span>
        <span>${authors} • ${year}</span>
      </div>
      <div class="title">${title}</div>
    </div>
    `;
    }

    $("search").onclick = async () => {
        const q = $("q").value.trim();
        const limit = $("limit").value;
        if (!q) return alert("Bitte Suchbegriff eingeben.");

        const url = `/api/search?q=${encodeURIComponent(q)}${buildTypesParam()}&limit=${encodeURIComponent(limit)}`;
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();
            $("results").innerHTML = (data && data.length)
                ? data.map(r => r.type === "book" ? bookCard(r) : card(r)).join("")
                : "<p class='muted'>Keine Treffer.</p>";
        } catch (e) {
            console.error(e);
            alert("Fehler bei der Suche (Details in der Konsole).");
        }
    };
</script>
</body>
</html>
