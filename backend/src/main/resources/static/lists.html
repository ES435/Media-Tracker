<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MT3 – Meine Listen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg-page: #f6efe8;
      --bg-card: #ffffff;
      --bg-soft: #fdf7f0;
      --accent: #f59e85;
      --accent-strong: #f97373;
      --accent-soft: #ffe6dd;
      --text-main: #262626;
      --text-muted: #8a7a6d;
      --border-soft: #e1d5c8;
      --shadow-soft: 0 20px 45px rgba(148, 118, 94, 0.25);
      --shadow-card: 0 12px 28px rgba(148, 118, 94, 0.18);
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #fef8f0 0, #f6efe8 40%, #f1e5d8 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 14px;
    }

    .app-shell {
      width: 100%;
      max-width: 1180px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* HEADER */

    .app-header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(225, 213, 200, 0.95);
      box-shadow: 0 16px 36px rgba(148, 118, 94, 0.28);
      backdrop-filter: blur(12px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-pill {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      background: radial-gradient(circle at 0 0, #f97373, #fbbf77 40%, #fde3b2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
      box-shadow: 0 8px 16px rgba(244, 114, 94, 0.6);
    }

    .app-name {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .app-name-main {
      font-size: 0.98rem;
      font-weight: 600;
    }

    .app-name-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .header-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .tab-link {
      position: relative;
      border-radius: var(--radius-pill);
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
    }

    .tab-link::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 3px;
      height: 2px;
      border-radius: 999px;
      background: transparent;
      opacity: 0;
      transform: translateY(3px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .tab-link:hover {
      background: #fbf2e7;
      color: var(--text-main);
      box-shadow: 0 4px 10px rgba(148, 118, 94, 0.16);
    }

    .tab-link.active {
      background: #faeee3;
      color: #b45309;
      box-shadow: 0 10px 22px rgba(148, 118, 94, 0.24);
    }

    .tab-link.active::after {
      background: var(--accent);
      opacity: 1;
      transform: translateY(0);
    }

    .header-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .user-avatar {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px 4px 4px;
      border-radius: 999px;
      background: #fff7f0;
      border: 1px solid rgba(221, 204, 188, 0.95);
      box-shadow: 0 4px 10px rgba(148, 118, 94, 0.18);
      transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .user-avatar:hover {
      transform: translateY(-1px);
      background: #fff1e8;
      box-shadow: 0 7px 16px rgba(148, 118, 94, 0.24);
    }

    .user-avatar-circle {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: linear-gradient(135deg, #f97373, #fb923c);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .user-avatar-name {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-main);
    }

    /* MAIN */

    .app-main {
      flex: 1;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 26px;
      border: 1px solid rgba(225, 213, 200, 0.95);
      box-shadow: var(--shadow-soft);
      padding: 18px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .lists-page {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100%;
    }

    /* Kopfbereich */

    .lists-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .lists-header-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .lists-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .lists-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .lists-summary-pill {
      border-radius: 999px;
      padding: 5px 12px;
      background: #fff7ef;
      border: 1px solid rgba(221, 204, 188, 0.95);
      font-size: 0.78rem;
      color: #7d6048;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .lists-summary-pill span:first-child {
      font-size: 0.9rem;
    }

    /* Medien-Typ-Übersicht */

    .lists-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .list-card {
      border-radius: 18px;
      background: #fffaf4;
      border: 1px solid rgba(225, 213, 200, 0.95);
      box-shadow: var(--shadow-card);
      padding: 10px 10px 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .list-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(148, 118, 94, 0.26);
      background: #fff6ed;
    }

    .list-card.active {
      border-color: var(--accent-soft);
      background: #fff2e7;
      box-shadow: 0 18px 36px rgba(244, 114, 94, 0.28);
    }

    .list-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .list-card-title {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .list-card-icon {
      font-size: 1rem;
    }

    /* Einträge-Bereich */

    .lists-entries-section {
      margin-top: 4px;
      border-top: 1px solid transparent;
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-entries-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      font-size: 0.8rem;
    }

    .list-entries-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .list-entries-name {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .list-entries-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-height: 1em;
    }

    .list-entries-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }

    .status-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    .status-chip {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.76rem;
      border: 1px solid rgba(221, 204, 188, 0.95);
      background: #fff9f3;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
    }

    .status-chip:hover {
      background: #fff2e8;
      color: var(--text-main);
      box-shadow: 0 4px 10px rgba(148, 118, 94, 0.16);
      transform: translateY(-1px);
    }

    .status-chip.active {
      background: #faeee3;
      color: #9a4f2c;
      box-shadow: 0 8px 18px rgba(148, 118, 94, 0.22);
      border-color: var(--accent-soft);
    }

    .view-toggle {
      display: inline-flex;
      border-radius: 999px;
      background: #fbf2e7;
      border: 1px solid rgba(221, 204, 188, 0.95);
      padding: 2px;
    }

    .view-toggle button {
      border: none;
      border-radius: 999px;
      background: transparent;
      padding: 4px 9px;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .view-toggle button.active {
      background: #fff;
      color: #9a4f2c;
      box-shadow: 0 4px 10px rgba(148, 118, 94, 0.2);
    }

    .results-wrapper {
      position: relative;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    /* WENN Detail offen: Liste komplett kollabieren (kein Abstand / keine Höhe) */
    .results-wrapper.hidden {
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      max-height: 0;
      margin-top: 0;
      margin-bottom: 0;
      overflow: hidden;
    }

    .results-container {
      position: relative;
      min-height: 160px;
    }

    /* Min-Höhe entfernen, wenn wir den Wrapper verstecken */
    .results-wrapper.hidden .results-container {
      min-height: 0;
    }

    .results-scroll {
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }

    .result-card,
    .result-card-grid {
      position: relative;
    }

    .result-card {
      display: grid;
      grid-template-columns: 64px minmax(0, 1.6fr) minmax(0, 0.9fr);
      gap: 8px;
      padding: 8px 10px;
      border-radius: 16px;
      background: #fffaf4;
      border: 1px solid rgba(225, 213, 200, 0.95);
      box-shadow: 0 10px 24px rgba(148, 118, 94, 0.18);
      cursor: pointer;
      transition: transform 0.09s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .result-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(148, 118, 94, 0.24);
      background: #fff7ef;
    }

    .result-card-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 8px 10px;
      border-radius: 16px;
      background: #fffaf4;
      border: 1px solid rgba(225, 213, 200, 0.95);
      box-shadow: 0 12px 26px rgba(148, 118, 94, 0.2);
      cursor: pointer;
      transition: transform 0.09s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .result-card-grid:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(148, 118, 94, 0.26);
      background: #fff7ef;
    }

    .result-thumb {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: radial-gradient(circle at 0 0, #f97373, #fb923c);
      border: 1px solid rgba(214, 191, 172, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 0.76rem;
      color: #fef3c7;
    }

    .result-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .result-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-title {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .result-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.74rem;
    }

    .result-tag {
      padding: 2px 7px;
      border-radius: 999px;
      background: #f1e4d8;
      border: 1px solid rgba(214, 191, 172, 0.9);
      color: #7d6a5a;
    }

    .result-tag strong {
      font-weight: 500;
      color: #4b3b30;
    }

    .result-secondary {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-size: 0.76rem;
    }

    .result-type-pill {
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #fff1eb;
      color: #b45309;
    }

    .result-pill {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: #faf1e5;
      color: #9a7152;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .empty-state.visible {
      display: flex;
    }

    .empty-card {
      max-width: 260px;
      text-align: center;
      padding: 18px 16px;
      border-radius: 20px;
      background: #fff8f1;
      border: 1px dashed rgba(221, 204, 188, 0.95);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 1.7rem;
      margin-bottom: 6px;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(140deg, rgba(255, 255, 255, 0.96), rgba(255, 250, 245, 0.96));
    }

    .loading-overlay.visible {
      display: flex;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 3px solid #f9e0d2;
      border-top-color: var(--accent-strong);
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Detail-Overlay (wie bei Suche, animiert) */

    .detail-overlay {
      display: none;
      margin-top: 6px; /* Weniger Luft zwischen Toggle und Detailkarte */
    }

    .detail-overlay.visible {
      display: block;
    }

    .detail-card {
      max-width: 680px;
      margin: 0 auto;
      border-radius: 22px;
      background: #fffdf9;
      border: 1px solid rgba(225, 213, 200, 0.95);
      box-shadow: var(--shadow-card);
      padding: 12px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      transform: translateY(26px) scale(0.97);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .detail-card.entered {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .detail-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .detail-header-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-header-title {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .detail-header-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .detail-back-btn {
      border-radius: var(--radius-pill);
      border: 1px solid rgba(221, 204, 188, 0.95);
      padding: 6px 12px;
      font-size: 0.8rem;
      background: #fff7f0;
      color: #222;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
    }

    .detail-back-btn:hover {
      background: #fff2e8;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(148, 118, 94, 0.2);
    }

    .detail-card-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .detail-top-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .detail-cover-mini {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      background: radial-gradient(circle at 0 0, #f97373, #fb923c);
      border: 1px solid rgba(214, 191, 172, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 0.76rem;
      color: #fef3c7;
    }

    .detail-cover-mini img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .detail-top-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .detail-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .detail-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .detail-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .detail-meta-tag {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f1e4d8;
      border: 1px solid rgba(214, 191, 172, 0.9);
      color: #7d6a5a;
    }

    .detail-form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
    }

    @media (max-width: 700px) {
      .detail-form-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .detail-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    .detail-select,
    .detail-input {
      width: 100%;
      padding: 7px 9px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: #fffbf6;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .detail-select:focus,
    .detail-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(243, 134, 134, 0.3);
      background: #fffdf9;
    }

    .detail-notes {
      min-height: 80px;
      resize: vertical;
    }

    .detail-actions-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .detail-actions-main {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .primary-button {
      border-radius: var(--radius-pill);
      border: none;
      padding: 8px 16px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent-strong), var(--accent));
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 24px rgba(244, 114, 94, 0.48);
      transition: transform 0.08s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .primary-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(244, 114, 94, 0.54);
      filter: brightness(1.02);
    }

    .outline-button {
      border-radius: var(--radius-pill);
      border: 1px solid rgba(221, 204, 188, 0.95);
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      background: #fff7f0;
      color: #222;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
    }

    .outline-button:hover {
      background: #fff2e8;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(148, 118, 94, 0.2);
    }

    .danger-button {
      border-color: rgba(248, 164, 143, 0.95);
      background: #fff0f0;
      color: #b91c1c;
    }

    .danger-button:hover {
      background: #ffe4e4;
      box-shadow: 0 6px 14px rgba(248, 113, 113, 0.35);
    }

    .detail-confirm {
      margin-top: 4px;
      font-size: 0.78rem;
      background: #fff2f2;
      border-radius: 14px;
      padding: 6px 8px;
      display: none;
      align-items: center;
      gap: 6px;
    }

    .detail-confirm button {
      border-radius: 999px;
      border: none;
      padding: 4px 10px;
      font-size: 0.76rem;
      cursor: pointer;
    }

    .detail-confirm-yes {
      background: #fee2e2;
      color: #b91c1c;
    }

    .detail-confirm-no {
      background: #f3e3d3;
      color: #7d6a5a;
    }

    /* Toast */

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      padding: 8px 12px;
      border-radius: 999px;
      background: #111827;
      color: #e5e7eb;
      font-size: 0.8rem;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.65);
    }

    .toast.visible {
      display: inline-flex;
    }

    .toast-pill {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #22c55e;
      color: #022c22;
    }

    .toast-pill.err {
      background: #f97373;
      color: #450a0a;
    }

    @media (max-width: 768px) {
      body { padding: 10px; }

      .app-header {
        grid-template-columns: 1fr;
        padding: 10px 12px;
      }

      .header-tabs {
        order: 3;
        justify-content: flex-start;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .app-main {
        padding: 10px 12px 12px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo-pill">MT3</div>
      <div class="app-name">
        <div class="app-name-main">Media Tracker 3</div>
        <div class="app-name-sub">Deine Bibliothek</div>
      </div>
    </div>

    <nav class="header-tabs" aria-label="Navigation">
      <a href="index.html" class="tab-link">Suche</a>
      <a href="lists.html" class="tab-link active">Meine Listen</a>
      <a href="tech.html" class="tab-link">Techstuff</a>
    </nav>

    <div class="header-right">
      <button class="user-avatar" type="button" id="avatarBtn">
        <div class="user-avatar-circle">UX</div>
        <div class="user-avatar-name">User_x</div>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="app-main">
    <section class="lists-page" aria-label="Meine Listen">
      <!-- Kopf -->
      <header class="lists-header">
        <div class="lists-header-main">
          <div class="lists-title">Meine Listen</div>
          <div class="lists-subtitle">
            Gefiltert nach Medientyp und Status.
          </div>
        </div>
        <div class="lists-summary-pill">
          <span>📚</span>
          <span id="listsSummaryText">Lade Bibliothek …</span>
        </div>
      </header>

      <!-- Medien-Typ-Auswahl -->
      <section class="lists-grid" id="listsGrid">
        <!-- Cards werden per JS gefüllt -->
      </section>

      <!-- Einträge + Detail -->
      <section class="lists-entries-section" aria-label="Listeneinträge">
        <header class="list-entries-header">
          <div class="list-entries-title">
            <div class="list-entries-name" id="activeListName">Liste</div>
            <div class="list-entries-desc" id="activeListDesc"></div>
          </div>

          <div class="list-entries-controls">
            <div class="status-filter-row" id="statusFilterRow">
              <button type="button" class="status-chip active" data-status="all">
                <span>•</span><span>Alle Status</span>
              </button>
              <button type="button" class="status-chip" data-status="PLANNED">
                <span>📝</span><span>Planned</span>
              </button>
              <button type="button" class="status-chip" data-status="IN_PROGRESS">
                <span>⏳</span><span>In Progress</span>
              </button>
              <button type="button" class="status-chip" data-status="COMPLETED">
                <span>✅</span><span>Completed</span>
              </button>
              <button type="button" class="status-chip" data-status="DROPPED">
                <span>🗂</span><span>Dropped</span>
              </button>
            </div>

            <div class="view-toggle" aria-label="Ansicht wechseln">
              <button type="button" id="listViewBtn" class="active">
                <span>☰</span>
                <span>Liste</span>
              </button>
              <button type="button" id="cardViewBtn">
                <span>▢▢</span>
                <span>Kacheln</span>
              </button>
            </div>
          </div>
        </header>

        <!-- Einträge (volle Breite) -->
        <div class="results-wrapper" id="resultsWrapper">
          <div class="results-container">
            <div class="loading-overlay" id="entriesLoading">
              <div class="spinner"></div>
            </div>

            <div class="empty-state" id="entriesEmpty">
              <div class="empty-card">
                <div class="empty-icon">🌱</div>
                <div><strong>Noch nichts hier.</strong></div>
                <div>Füge zuerst Einträge über die Suche hinzu.</div>
              </div>
            </div>

            <div class="results-scroll">
              <div class="results-list" id="resultsList"></div>
              <div class="results-grid" id="resultsGrid" style="display:none;"></div>
            </div>
          </div>
        </div>

        <!-- Detail-View (animiert, öffnet wie bei Suche) -->
        <section class="detail-overlay" id="detailOverlay" aria-label="Eintragsdetails">
          <article class="detail-card" id="detailCard">
            <header class="detail-header-row">
              <button type="button" class="detail-back-btn" id="detailBackBtn">
                <span>←</span><span>Zurück zu den Einträgen</span>
              </button>
              <div class="detail-header-text">
                <div class="detail-header-title" id="detailHeaderTitle">Titel</div>
                <div class="detail-header-sub" id="detailHeaderSub">Typ</div>
              </div>
            </header>

            <div class="detail-card-body">
              <div class="detail-top-row">
                <div class="detail-cover-mini" id="detailCoverMini">
                  MT3
                </div>
                <div class="detail-top-text">
                  <div class="detail-title" id="detailTitle">Titel</div>
                  <div class="detail-subtitle" id="detailSubtitle"></div>
                  <div class="detail-meta-tags" id="detailMetaTags"></div>
                </div>
              </div>

              <div class="detail-form-grid">
                <div class="detail-field">
                  <label class="detail-label" for="detailStatus">Status</label>
                  <select id="detailStatus" class="detail-select">
                    <option value="PLANNED">Planned</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="DROPPED">Dropped</option>
                  </select>
                </div>
                <div class="detail-field">
                  <label class="detail-label" for="detailRating">Rating (1–10)</label>
                  <input
                          id="detailRating"
                          class="detail-input"
                          type="number"
                          min="1"
                          max="10"
                          placeholder="z.B. 9"
                  >
                </div>
              </div>

              <div class="detail-field">
                <label class="detail-label" for="detailNotes">Notizen</label>
                <textarea
                        id="detailNotes"
                        class="detail-input detail-notes"
                        placeholder="Eigene Gedanken, Fortschritt oder Stimmung …"
                ></textarea>
              </div>

              <div class="detail-actions-row">
                <div class="detail-actions-main">
                  <button type="button" class="primary-button" id="detailSaveBtn">
                    <span>💾</span>
                    <span>Änderungen speichern</span>
                  </button>
                  <button type="button" class="outline-button danger-button" id="detailRemoveBtn">
                    <span>🗑</span>
                    <span>Aus Bibliothek entfernen</span>
                  </button>
                </div>
              </div>

              <div class="detail-confirm" id="detailConfirm">
                <span>Eintrag wirklich entfernen?</span>
                <button type="button" class="detail-confirm-yes" id="detailConfirmYes">Ja</button>
                <button type="button" class="detail-confirm-no" id="detailConfirmNo">Nein</button>
              </div>
            </div>
          </article>
        </section>
      </section>
    </section>
  </main>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span class="toast-pill" id="toastPill">OK</span>
  <span id="toastMsg">Nachricht</span>
</div>

<script>
  (function () {
    const qs  = (sel) => document.querySelector(sel);
    const qsa = (sel) => Array.from(document.querySelectorAll(sel));

    const state = {
      library: [],
      activeMediaTypeId: 'all',
      statusFilter: 'all',
      viewMode: 'list',
      selectedEntryId: null
    };

    // Medientyp-Karten (oben) – nur Name + Icon
    const mediaTypeLists = [
      { id: 'all',    name: 'Alle Medien', icon: '📚', matches: (e) => true },
      { id: 'anime',  name: 'Anime',       icon: '🍥', matches: (e) => e.mediaItem?.type === 'anime' },
      { id: 'music',  name: 'Music',       icon: '🎧', matches: (e) => e.mediaItem?.type === 'music' },
      { id: 'movie',  name: 'Movies',      icon: '🎬', matches: (e) => e.mediaItem?.type === 'movie' },
      { id: 'game',   name: 'Games',       icon: '🎮', matches: (e) => e.mediaItem?.type === 'game' },
      { id: 'series', name: 'Series',      icon: '📺', matches: (e) => e.mediaItem?.type === 'series' },
      { id: 'book',   name: 'Bücher',      icon: '📖', matches: (e) => e.mediaItem?.type === 'book' },
      { id: 'manga',  name: 'Manga',       icon: '📚', matches: (e) => e.mediaItem?.type === 'manga' }
    ];

    const listsGrid         = qs('#listsGrid');
    const listsSummaryText  = qs('#listsSummaryText');
    const activeListName    = qs('#activeListName');
    const activeListDesc    = qs('#activeListDesc');

    const statusFilterRow   = qs('#statusFilterRow');

    const listViewBtn       = qs('#listViewBtn');
    const cardViewBtn       = qs('#cardViewBtn');

    const resultsWrapper    = qs('#resultsWrapper');
    const entriesLoading    = qs('#entriesLoading');
    const entriesEmpty      = qs('#entriesEmpty');
    const resultsList       = qs('#resultsList');
    const resultsGrid       = qs('#resultsGrid');

    const detailOverlay     = qs('#detailOverlay');
    const detailCard        = qs('#detailCard');
    const detailBackBtn     = qs('#detailBackBtn');
    const detailHeaderTitle = qs('#detailHeaderTitle');
    const detailHeaderSub   = qs('#detailHeaderSub');

    const detailCoverMini   = qs('#detailCoverMini');
    const detailTitle       = qs('#detailTitle');
    const detailSubtitle    = qs('#detailSubtitle');
    const detailMetaTags    = qs('#detailMetaTags');
    const detailStatus      = qs('#detailStatus');
    const detailRating      = qs('#detailRating');
    const detailNotes       = qs('#detailNotes');
    const detailSaveBtn     = qs('#detailSaveBtn');
    const detailRemoveBtn   = qs('#detailRemoveBtn');
    const detailConfirm     = qs('#detailConfirm');
    const detailConfirmYes  = qs('#detailConfirmYes');
    const detailConfirmNo   = qs('#detailConfirmNo');

    const toast      = qs('#toast');
    const toastPill  = qs('#toastPill');
    const toastMsg   = qs('#toastMsg');
    let toastTimeout = null;

    function showToast(message, mode = 'ok') {
      toastMsg.textContent = message;
      toastPill.textContent = mode === 'ok' ? 'OK' : 'ERR';
      toastPill.className = 'toast-pill' + (mode === 'ok' ? '' : ' err');
      toast.classList.add('visible');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('visible'), 2400);
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      listViewBtn.classList.toggle('active', mode === 'list');
      cardViewBtn.classList.toggle('active', mode === 'cards');

      if (mode === 'list') {
        resultsList.style.display = 'flex';
        resultsGrid.style.display = 'none';
      } else {
        resultsList.style.display = 'none';
        resultsGrid.style.display = 'grid';
      }
    }

    listViewBtn.addEventListener('click', () => setViewMode('list'));
    cardViewBtn.addEventListener('click', () => setViewMode('cards'));
    setViewMode('list');

    function getActiveMediaTypeConfig() {
      return mediaTypeLists.find(l => l.id === state.activeMediaTypeId) || mediaTypeLists[0];
    }

    function getFilteredEntries() {
      const cfg = getActiveMediaTypeConfig();
      let entries = state.library.filter(cfg.matches);
      if (state.statusFilter !== 'all') {
        entries = entries.filter(e => e.status === state.statusFilter);
      }
      return entries;
    }

    function renderMediaTypeCards() {
      listsGrid.innerHTML = '';
      mediaTypeLists.forEach(cfg => {
        const card = document.createElement('article');
        card.className = 'list-card' + (cfg.id === state.activeMediaTypeId ? ' active' : '');
        card.dataset.id = cfg.id;

        const header = document.createElement('div');
        header.className = 'list-card-header';

        const title = document.createElement('div');
        title.className = 'list-card-title';
        title.textContent = cfg.name;

        const icon = document.createElement('div');
        icon.className = 'list-card-icon';
        icon.textContent = cfg.icon;

        header.appendChild(title);
        header.appendChild(icon);
        card.appendChild(header);

        card.addEventListener('click', () => {
          state.activeMediaTypeId = cfg.id;
          state.selectedEntryId = null;
          renderMediaTypeCards();
          clearDetail();
          renderEntries();
        });

        listsGrid.appendChild(card);
      });

      listsSummaryText.textContent = state.library.length + ' Einträge in deiner Bibliothek';
    }

    function renderEntries() {
      const entries = getFilteredEntries();
      const cfg = getActiveMediaTypeConfig();

      activeListName.textContent = cfg.name;
      activeListDesc.textContent = '';

      resultsList.innerHTML = '';
      resultsGrid.innerHTML = '';

      if (!entries.length) {
        entriesEmpty.classList.add('visible');
        return;
      }
      entriesEmpty.classList.remove('visible');

      entries.forEach(entry => {
        const media = entry.mediaItem || {};
        const title = media.title || '(ohne Titel)';
        const type  = media.type || 'unknown';
        const rating = entry.rating;
        const status = entry.status;

        // Listen-Ansicht
        const row = document.createElement('article');
        row.className = 'result-card';
        row.dataset.id = entry.id;

        const thumb = document.createElement('div');
        thumb.className = 'result-thumb';
        if (media.imageUrl) {
          const img = document.createElement('img');
          img.src = media.imageUrl;
          img.alt = title;
          thumb.appendChild(img);
        } else {
          thumb.textContent = 'MT3';
        }

        const main = document.createElement('div');
        main.className = 'result-main';

        const titleEl = document.createElement('div');
        titleEl.className = 'result-title';
        titleEl.textContent = title;

        const metaRow = document.createElement('div');
        metaRow.className = 'result-meta-row';

        const typeTag = document.createElement('div');
        typeTag.className = 'result-tag';
        typeTag.innerHTML = '<strong>' + type + '</strong>';
        metaRow.appendChild(typeTag);

        if (typeof rating === 'number') {
          const ratingTag = document.createElement('div');
          ratingTag.className = 'result-tag';
          ratingTag.innerHTML = '<strong>Rating</strong> · ' + rating;
          metaRow.appendChild(ratingTag);
        }

        if (status) {
          const statusTag = document.createElement('div');
          statusTag.className = 'result-tag';
          statusTag.innerHTML = '<strong>Status</strong> · ' + status;
          metaRow.appendChild(statusTag);
        }

        const secondary = document.createElement('div');
        secondary.className = 'result-secondary';
        secondary.textContent = entry.notes
                ? (entry.notes.length > 70 ? entry.notes.slice(0, 67) + '…' : entry.notes)
                : 'Keine Notizen hinterlegt.';

        main.appendChild(titleEl);
        main.appendChild(metaRow);
        main.appendChild(secondary);

        const actions = document.createElement('div');
        actions.className = 'result-actions';

        const typeBadge = document.createElement('div');
        typeBadge.className = 'result-type-pill';
        typeBadge.textContent = type;

        const hint = document.createElement('div');
        hint.className = 'result-pill';
        hint.textContent = 'Details öffnen';

        actions.appendChild(typeBadge);
        actions.appendChild(hint);

        row.appendChild(thumb);
        row.appendChild(main);
        row.appendChild(actions);

        row.addEventListener('click', () => {
          state.selectedEntryId = entry.id;
          openDetail(entry);
        });

        resultsList.appendChild(row);

        // Kachel-Ansicht
        const card = document.createElement('article');
        card.className = 'result-card-grid';
        card.dataset.id = entry.id;

        const cardThumb = document.createElement('div');
        cardThumb.className = 'result-thumb';
        if (media.imageUrl) {
          const img2 = document.createElement('img');
          img2.src = media.imageUrl;
          img2.alt = title;
          cardThumb.appendChild(img2);
        } else {
          cardThumb.textContent = 'MT3';
        }

        const cardTitle = document.createElement('div');
        cardTitle.className = 'result-title';
        cardTitle.textContent = title;

        const cardMetaRow = document.createElement('div');
        cardMetaRow.className = 'result-meta-row';

        const cardTypeTag = document.createElement('div');
        cardTypeTag.className = 'result-tag';
        cardTypeTag.innerHTML = '<strong>' + type + '</strong>';
        cardMetaRow.appendChild(cardTypeTag);

        if (typeof rating === 'number') {
          const rBadge = document.createElement('div');
          rBadge.className = 'result-tag';
          rBadge.textContent = '★ ' + rating;
          cardMetaRow.appendChild(rBadge);
        }

        const cardHint = document.createElement('div');
        cardHint.className = 'result-secondary';
        cardHint.textContent = 'Tippe, um Details zu öffnen.';

        card.appendChild(cardThumb);
        card.appendChild(cardTitle);
        card.appendChild(cardMetaRow);
        card.appendChild(cardHint);

        card.addEventListener('click', () => {
          state.selectedEntryId = entry.id;
          openDetail(entry);
        });

        resultsGrid.appendChild(card);
      });
    }

    function clearDetail() {
      detailCard.classList.remove('entered');
      detailOverlay.classList.remove('visible');
      resultsWrapper.classList.remove('hidden');
      state.selectedEntryId = null;
    }

    function openDetail(entry) {
      const media = entry.mediaItem || {};
      const title = media.title || '(ohne Titel)';
      const type  = media.type || 'unknown';

      // Liste "wegfaden + kollabieren"
      resultsWrapper.classList.add('hidden');

      // Detail-Daten setzen
      detailCoverMini.innerHTML = '';
      if (media.imageUrl) {
        const img = document.createElement('img');
        img.src = media.imageUrl;
        img.alt = title;
        detailCoverMini.appendChild(img);
      } else {
        detailCoverMini.textContent = 'MT3';
      }

      detailHeaderTitle.textContent = title;
      detailHeaderSub.textContent   = type;
      detailTitle.textContent       = title;
      detailSubtitle.textContent    = type;

      detailMetaTags.innerHTML = '';
      const tags = [];
      if (typeof entry.rating === 'number') tags.push('Rating: ' + entry.rating);
      if (entry.status) tags.push('Status: ' + entry.status);
      tags.forEach(t => {
        const tag = document.createElement('div');
        tag.className = 'detail-meta-tag';
        tag.textContent = t;
        detailMetaTags.appendChild(tag);
      });

      detailStatus.value = entry.status || 'PLANNED';
      detailRating.value = entry.rating != null ? entry.rating : '';
      detailNotes.value  = entry.notes || '';

      // Detail anzeigen + Animation wie bei Suche
      detailOverlay.classList.add('visible');
      detailCard.classList.remove('entered');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          detailCard.classList.add('entered');
        });
      });
    }

    function getSelectedEntry() {
      return state.library.find(e => e.id === state.selectedEntryId) || null;
    }

    function syncDetailToEntry(entry) {
      entry.status = detailStatus.value;
      entry.rating = detailRating.value ? Number(detailRating.value) : null;
      entry.notes  = detailNotes.value.trim();
    }

    function updateLocalEntry(updatedFromServer) {
      const idx = state.library.findIndex(e => e.id === updatedFromServer.id);
      if (idx >= 0) {
        state.library[idx] = updatedFromServer;
      }
    }

    function sendUpdateForSelected() {
      const entry = getSelectedEntry();
      if (!entry) {
        showToast('Kein Eintrag ausgewählt.', 'err');
        return;
      }

      syncDetailToEntry(entry);

      const media = entry.mediaItem || {};
      const body = {
        status: entry.status,
        rating: entry.rating,
        notes:  entry.notes,
        searchResult: {
          type:      media.type,
          id:        media.externalId,
          title:     media.title,
          imageUrl:  media.imageUrl,
          sourceUrl: media.sourceUrl,
          meta:      {}
        }
      };

      fetch('/api/library', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      })
              .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
              })
              .then(data => {
                updateLocalEntry(data);
                showToast('Änderungen gespeichert.');
                renderMediaTypeCards();
                renderEntries();
                const updated = getSelectedEntry();
                if (updated) {
                  openDetail(updated);
                } else {
                  clearDetail();
                }
              })
              .catch(err => {
                console.error(err);
                showToast('Fehler beim Speichern.', 'err');
              });
    }

    function sendDeleteForSelected() {
      const entry = getSelectedEntry();
      if (!entry) {
        showToast('Kein Eintrag ausgewählt.', 'err');
        return;
      }

      fetch('/api/library/' + encodeURIComponent(entry.id), {
        method: 'DELETE'
      })
              .then(res => {
                if (!res.ok && res.status !== 204) {
                  throw new Error('HTTP ' + res.status);
                }
              })
              .then(() => {
                state.library = state.library.filter(e => e.id !== entry.id);
                state.selectedEntryId = null;
                showToast('Eintrag entfernt.');
                clearDetail();
                renderMediaTypeCards();
                renderEntries();
              })
              .catch(err => {
                console.error(err);
                showToast('Fehler beim Entfernen.', 'err');
              });
    }

    detailSaveBtn.addEventListener('click', sendUpdateForSelected);

    detailRemoveBtn.addEventListener('click', () => {
      detailConfirm.style.display = 'inline-flex';
    });

    detailConfirmYes.addEventListener('click', () => {
      detailConfirm.style.display = 'none';
      sendDeleteForSelected();
    });

    detailConfirmNo.addEventListener('click', () => {
      detailConfirm.style.display = 'none';
    });

    // Zurück-Button schließt Detail und zeigt Liste wieder
    detailBackBtn.addEventListener('click', () => {
      clearDetail();
    });

    // Status-Filter
    statusFilterRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.status-chip');
      if (!btn) return;
      const status = btn.dataset.status || 'all';
      state.statusFilter = status;

      qsa('.status-chip').forEach(b => {
        b.classList.toggle('active', b === btn);
      });

      state.selectedEntryId = null;
      clearDetail();
      renderEntries();
    });

    function loadLibrary() {
      entriesLoading.classList.add('visible');
      entriesEmpty.classList.remove('visible');
      resultsList.innerHTML = '';
      resultsGrid.innerHTML = '';

      fetch('/api/library')
              .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
              })
              .then(data => {
                state.library = Array.isArray(data) ? data : [];
                renderMediaTypeCards();
                clearDetail();
                renderEntries();
              })
              .catch(err => {
                console.error(err);
                state.library = [];
                renderMediaTypeCards();
                clearDetail();
                renderEntries();
                showToast('Fehler beim Laden der Bibliothek.', 'err');
              })
              .finally(() => {
                entriesLoading.classList.remove('visible');
              });
    }

    qs('#avatarBtn').addEventListener('click', () => {
      showToast('Demo-User: User_x');
    });

    loadLibrary();
  })();
</script>
</body>
</html>
