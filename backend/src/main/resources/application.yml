# ==============================
#  APPLICATION CONFIG
# ==============================
spring:
  application:
    name: media-tracker-backend

# ==============================
#  SERVER SETTINGS
# ==============================
server:
  port: 8080

# ==============================
#  DATABASE CONFIGURATION
# ==============================
#  Standardmäßig deaktiviert (noch keine DB angebunden)
#  Wenn Docker mit PostgreSQL läuft, einfach einkommentieren.
#
# spring:
#   datasource:
#     url: jdbc:postgresql://db:5432/mediatracker
#     username: postgres
#     password: postgres
#   jpa:
#     hibernate:
#       ddl-auto: update
#     show-sql: true
#     properties:
#       hibernate.format_sql: true
#
# --- LOKAL (ohne Docker) ---
#   datasource:
#     url: jdbc:postgresql://localhost:5432/mediatracker
#     username: postgres
#     password: postgres
#   jpa:
#     hibernate:
#       ddl-auto: update
#     show-sql: true
#     properties:
#       hibernate.format_sql: true

# ==============================
#  CORS CONFIGURATION
# ==============================
# Erlaubt das lokale Frontend (HTML/JS) z. B. auf Port 5500 oder 3000
cors:
  allowed-origins: "http://localhost:3000,http://127.0.0.1:5500"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true

# ==============================
#  LOGGING
# ==============================
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"

# ==============================
#  PROFILES
# ==============================
# Später kann man mehrere Files haben:
# - application-dev.yml
# - application-prod.yml
# Aktivierung via:
# SPRING_PROFILES_ACTIVE=dev
# ==============================